name: abiko-bench
services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.5@sha256:0b05666882bfb67f45d559a5b827839c54127b74aedd723f8ab338a3571b5fc9
    ports: ["127.0.0.1:11335:11235"]
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Run scripts/setup.sh first}
      CRAWL4AI_ALLOW_DEEP_CRAWL: "false"
    shm_size: 1gb
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
