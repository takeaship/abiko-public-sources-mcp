[project]
name = "abiko-crawler-bench"
version = "0.1.0"
description = "Crawl4AI-backed MCP for Abiko public documents"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "mcp>=1.23,<2", "beautifulsoup4>=4.14,<5", "pymupdf>=1.26,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
